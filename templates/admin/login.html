<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Satya Sai Baba Auto Electrical Works</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700;800&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body style="background:var(--dark);min-height:100vh;display:flex;align-items:center;justify-content:center">
  <div style="width:100%;max-width:420px;padding:20px">
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for cat,msg in messages %}<div class="alert alert-{{ 'success' if cat=='success' else 'danger' }} mb-3">{{ msg }}</div>{% endfor %}{% endif %}{% endwith %}
    <div class="card-dark text-center">
      <div style="width:64px;height:64px;background:var(--yellow);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;color:var(--dark)"><i class="fas fa-bolt"></i></div>
      <h2 style="font-family:var(--font-display);color:var(--yellow);font-size:22px">Admin Panel</h2>
      <p class="text-muted small">Satya Sai Baba Auto Electrical Works</p>
      <form method="POST" action="/admin/login" class="form-dark mt-4 text-start">
        <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" required autofocus></div>
        <div class="mb-4"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn-primary-custom w-100" style="padding:14px;font-size:16px"><i class="fas fa-sign-in-alt me-2"></i>Login</button>
      </form>
      <a href="/" class="d-block mt-3 text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to website</a>
    </div>
  </div>
</body>
</html>
